# ==========================================================
# 基础端口与运行模式
# ==========================================================
mixed-port: 7890
redir-port: 7892
tproxy-port: 7893

allow-lan: true
bind-address: "*"
mode: rule
log-level: info
ipv6: false
udp: true

unified-delay: true
tcp-concurrent: true

profile:
  store-selected: true
  store-fake-ip: true

# ==========================================================
# DNS（Fake-IP 增强，适配 TUN / Mixed）
# ==========================================================
dns:
  enable: true
  cache-algorithm: arc
  prefer-h3: false
  use-hosts: true
  use-system-hosts: true
  listen: 0.0.0.0:7974
  ipv6: false
  default-nameserver:
  - 119.29.29.29#disable-ipv6=true
  - 223.5.5.5#disable-ipv6=true
  nameserver:
  - https://doh.pub/dns-query#disable-ipv6=true
  - https://dns.alidns.com/dns-query#disable-ipv6=true
  proxy-server-nameserver:
  - https://hydrogen1693.com:44443/dns-query/813f820b-8d27-4d48-afcc-e775ece74175
  - https://subprime7404.com:44443/dns-query/813f820b-8d27-4d48-afcc-e775ece74175
  - https://tribunal2944.com/dns-query/813f820b-8d27-4d48-afcc-e775ece74175

  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4

# ==========================================================
# TUN 模块（全接管，核心关键）
# ==========================================================
tun:
  enable: true
  stack: system
  auto-route: true
  auto-detect-interface: true
  strict-route: false
  dns-hijack:
    - any:53

# ==========================================================
# GEO 数据库声明（与 OpenClash 数据库页面对齐）
# ==========================================================
geodata-mode: true
geox-url:
  geoip: https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat
  geosite: https://github.com/MetaCubeX/meta-rules-dat/releases/latest/download/geosite.dat

# ==========================================================
# 实验性特性（安全开启）
# ==========================================================
experimental:
  sniff-tls-sni: true
  sniff-http-host: true
