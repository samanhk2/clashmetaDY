[custom]
; ==========================================================
; 基础
; ==========================================================
enable_rule_generator=true
overwrite_original_rules=true

; ==========================================================
; 1) 应用分流策略组（UI 主入口）
;    注意：这里不提供“手动选择/自动选择”，只允许地区组 + DIRECT + Default
; ==========================================================
custom_proxy_group=🍎 Apple`select`[]🚀 HK`[]🚀 TW`[]🚀 JP`[]🚀 SG`[]🚀 US`[]DIRECT`[]🌐 Default
custom_proxy_group=🤖 ChatGPT`select`[]🚀 HK`[]🚀 TW`[]🚀 JP`[]🚀 SG`[]🚀 US`[]🌐 Default
custom_proxy_group=🧠 AI`select`[]🚀 HK`[]🚀 TW`[]🚀 JP`[]🚀 SG`[]🚀 US`[]🌐 Default
custom_proxy_group=📨 Telegram`select`[]🚀 HK`[]🚀 TW`[]🚀 JP`[]🚀 SG`[]🚀 US`[]🌐 Default
custom_proxy_group=🎬 YouTube`select`[]🚀 HK`[]🚀 TW`[]🚀 JP`[]🚀 SG`[]🚀 US`[]🌐 Default
custom_proxy_group=🎥 Netflix`select`[]🚀 HK`[]🚀 TW`[]🚀 JP`[]🚀 SG`[]🚀 US`[]🌐 Default

custom_proxy_group=🟦 OKX`select`[]🚀 HK`[]🚀 TW`[]🚀 JP`[]🚀 SG`[]🚀 US`[]DIRECT`[]🌐 Default
custom_proxy_group=🟨 Binance`select`[]🚀 HK`[]🚀 TW`[]🚀 JP`[]🚀 SG`[]🚀 US`[]DIRECT`[]🌐 Default
custom_proxy_group=🟪 Bybit`select`[]🚀 HK`[]🚀 TW`[]🚀 JP`[]🚀 SG`[]🚀 US`[]DIRECT`[]🌐 Default

; Adobe：增加“禁止联网”
custom_proxy_group=🟥 Adobe`select`[]🚀 HK`[]🚀 TW`[]🚀 JP`[]🚀 SG`[]🚀 US`[]DIRECT`[]REJECT`[]🌐 Default


; ==========================================================
; 2) 规则集（meta-rules-dat + Aethersailor 风格基础直连/拦截）
; ==========================================================

; --- Aethersailor 常用：私网/保留地址直连（避免内网服务走代理）
ruleset=DIRECT,[]GEOSITE,private
ruleset=DIRECT,[]GEOIP,private,no-resolve

; --- Aethersailor 常用：广告/跟踪拦截（可选，想干净就保留）
ruleset=REJECT,[]GEOSITE,category-ads-all

; --- 应用规则集（保持你现有 meta-rules-dat，稳定易用）
ruleset=🤖 ChatGPT,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/openai.yaml
ruleset=🧠 AI,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/ai.yaml
ruleset=🍎 Apple,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/apple.yaml
ruleset=📨 Telegram,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/telegram.yaml
ruleset=🎬 YouTube,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/youtube.yaml
ruleset=🎥 Netflix,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/netflix.yaml
ruleset=🟦 OKX,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/okx.yaml
ruleset=🟨 Binance,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/binance.yaml
ruleset=🟪 Bybit,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/bybit.yaml
ruleset=🟥 Adobe,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/adobe.yaml

; --- 国内直连（域名库 + IP 双兜底）
ruleset=DIRECT,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/cn.yaml
ruleset=DIRECT,[]GEOSITE,cn
ruleset=DIRECT,[]GEOIP,cn,no-resolve


; ==========================================================
; 3) 全局 Default / 漏网之鱼（Aethersailor 风格核心）
;    这里才提供“手动选择/自动选择”，用于非应用命中时的兜底与全局调试
; ==========================================================
custom_proxy_group=🧭 手动选择`select`.*
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50

custom_proxy_group=🌐 Default`select`[]♻️ 自动选择`[]🧭 手动选择`[]🚀 HK`[]🚀 TW`[]🚀 JP`[]🚀 SG`[]🚀 US`[]DIRECT

custom_proxy_group=🐟 漏网之鱼`select`[]🌐 Default`[]DIRECT`[]♻️ 自动选择`[]🧭 手动选择


; ==========================================================
; 4) 基础设施：国家节点测速组（按你要求放到下面，且保持你原样不动）
; ==========================================================
custom_proxy_group=🚀 HK`url-test`(?i)(🇭🇰|香港|\\bHK\\b|hongkong)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🚀 TW`url-test`(?i)(🇹🇼|台湾|\\bTW\\b|taiwan|taipei|hinet)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🚀 JP`url-test`(?i)(🇯🇵|日本|\\bJP\\b|tokyo|osaka)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🚀 SG`url-test`(?i)(🇸🇬|新加坡|\\bSG\\b|singapore)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🚀 US`url-test`(?i)(🇺🇸|美国|\\bUS\\b|united states|los angeles|san jose|seattle|new york)`http://www.gstatic.com/generate_204`300,,50

; ==========================================================
; 5) 最终兜底
; ==========================================================
; 兜底前再保护一次私网（防止某些未命中的内网域名走代理）
ruleset=DIRECT,[]GEOIP,private,no-resolve

final=🐟 漏网之鱼
