  - RULE-SET,youtube,🎬 YouTube
  - RULE-SET,apple,🍎 Apple
  - RULE-SET,ai,🧠 AI
  - RULE-SET,telegram,📨 Telegram
  - RULE-SET,okx,🟦 OKX
  - RULE-SET,binance,🟨 Binance
  - RULE-SET,adobe,🟥 Adobe

  # Proton（常用域名，足够稳定）
  - DOMAIN-SUFFIX,proton.me,🟪 Proton
  - DOMAIN-SUFFIX,protonvpn.com,🟪 Proton
  - DOMAIN-SUFFIX,protonmail.com,🟪 Proton
  - DOMAIN-SUFFIX,pm.me,🟪 Proton
  - DOMAIN-SUFFIX,protonstatus.com,🟪 Proton

  # 国内直连
  - RULE-SET,cn,DIRECT
  - GEOIP,CN,DIRECT

  # 兜底
  - MATCH,🌐 Default
