port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: info
external-controller: 0.0.0.0:9090
udp: true
unified-delay: true
tcp-concurrent: true

profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  cache-algorithm: arc
  prefer-h3: false
  use-hosts: true
  use-system-hosts: true
  listen: 0.0.0.0:7974
  ipv6: false
  default-nameserver:
  - 119.29.29.29#disable-ipv6=true
  - 223.5.5.5#disable-ipv6=true
  nameserver:
  - https://doh.pub/dns-query#disable-ipv6=true
  - https://dns.alidns.com/dns-query#disable-ipv6=true
  proxy-server-nameserver:
  - https://hydrogen1693.com:44443/dns-query/813f820b-8d27-4d48-afcc-e775ece74175
  - https://subprime7404.com:44443/dns-query/813f820b-8d27-4d48-afcc-e775ece74175
  - https://tribunal2944.com/dns-query/813f820b-8d27-4d48-afcc-e775ece74175
  
  fallback-filter:
    geoip: true
    geoip-code: CN

# =========================
# 策略组：第一层（应用）+ 第二层（国家测速）
# 关键：include-all + filter 自动从 proxies 里筛选
# =========================
proxy-groups:
  # ---- 国家测速组（第二层）----
  - name: "🚀 HK"
    type: url-test
    include-all: true
    filter: "(?i)(🇭🇰|香港|\\bHK\\b|hong\\s*kong)"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: "🚀 JP"
    type: url-test
    include-all: true
    filter: "(?i)(🇯🇵|日本|\\bJP\\b|tokyo|osaka)"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: "🚀 TW"
    type: url-test
    include-all: true
    filter: "(?i)(🇹🇼|台湾|\\bTW\\b|taiwan|taipei|hinet)"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: "🚀 US"
    type: url-test
    include-all: true
    filter: "(?i)(🇺🇸|美国|\\bUS\\b|united\\s*states|los\\s*angeles|san\\s*jose|seattle|new\\s*york)"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: "🚀 SG"
    type: url-test
    include-all: true
    filter: "(?i)(🇸🇬|新加坡|\\bSG\\b|singapore)"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: "♻️ Fallback"
    type: fallback
    proxies: ["🚀 HK","🚀 SG","🚀 JP","🚀 US","🚀 TW"]
    url: http://www.gstatic.com/generate_204
    interval: 300

  # ---- 默认出口（兜底）----
  - name: "🌐 Default"
    type: select
    proxies:
      - ♻️ Fallback
      - 🚀 HK
      - 🚀 SG
      - 🚀 JP
      - 🚀 US
      - 🚀 TW
      - DIRECT

  # ---- 应用策略组（第一层）----
  - name: "🎬 YouTube"
    type: select
    proxies: ["🚀 TW","🚀 JP","🚀 HK","🌐 Default","DIRECT"]

  - name: "🤖 ChatGPT"
    type: select
    proxies: ["🚀 JP","🚀 US","🚀 SG","🌐 Default"]

  - name: "🍎 Apple"
    type: select
    proxies: ["🚀 US","DIRECT","🌐 Default"]

  - name: "📨 Telegram"
    type: select
    proxies: ["🚀 SG","🚀 HK","🚀 JP","🌐 Default"]

  - name: "🧠 AI"
    type: select
    proxies: ["🚀 JP","🚀 SG","🚀 US","🌐 Default"]

  - name: "🟦 OKX"
    type: select
    proxies: ["🚀 HK","🚀 SG","🌐 Default","DIRECT"]

  - name: "🟨 Binance"
    type: select
    proxies: ["🚀 HK","🚀 SG","🌐 Default","DIRECT"]

  - name: "🟥 Adobe"
    type: select
    proxies: ["🚀 US","🚀 JP","🌐 Default","DIRECT"]

  - name: "🟪 Proton"
    type: select
    proxies: ["🚀 US","🚀 SG","🚀 JP","🌐 Default"]

  # 面板总开关（可选）
  - name: "🚀 PROXY"
    type: select
    proxies: ["🌐 Default","♻️ Fallback","DIRECT"]

